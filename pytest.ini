[pytest]
# Without this, pytest walks the ENTIRE project tree looking for anything
# matching test_*.py / *_test.py — including reference/ (old SQLAlchemy
# reference scripts) and any stray scratch_test.py left at the root.
# Those aren't real test suites; they're exploratory scripts that happen
# to match the naming pattern by coincidence.
#
# testpaths tells pytest: only look inside tests/. Nothing outside that
# folder gets imported or collected, no matter what it's named.
testpaths = tests